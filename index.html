<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stock Manager</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <main class="container">
      <header class="toolbar">
        <h1>Stock Manager</h1>
        <span id="item-count" class="count" hidden></span>
        <button type="button" id="add-btn">Add Item</button>
        <button type="button" id="settings-btn" aria-label="Settings">⚙</button>
      </header>

      <form id="item-form" hidden>
        <h2 id="form-title">Add item</h2>
        <div class="row">
          <label for="name">Name</label>
          <input id="name" name="name" placeholder="Item name" required />

          <label for="quantity">Quantity</label>
          <input id="quantity" name="quantity" type="number" min="0" step="any" value="0" required />

          <label for="unit">Unit</label>
          <select id="unit" name="unit"></select>
        </div>
        <div class="row">
          <label for="notes">Notes</label>
          <input id="notes" name="notes" placeholder="Optional notes" />
        </div>
        <div class="row">
          <label for="consumed-per-day">Consumed/day</label>
          <input id="consumed-per-day" name="consumed-per-day" type="number" min="0" step="any" placeholder="optional" />

          <label for="alert-days">Alert before empty (days)</label>
          <input id="alert-days" name="alert-days" type="number" min="0" step="any" placeholder="optional" />
        </div>
        <div class="row actions">
          <button type="submit" id="submit-btn">Add item</button>
          <button type="button" id="cancel-btn" hidden>Cancel</button>
        </div>
      </form>

      <section id="settings-sheet" hidden>
        <h2>Settings</h2>
        <label class="check-row">
          <input type="checkbox" id="launch-at-login" />
          Launch at login <span class="check-hint">(starts hidden in the tray)</span>
        </label>
      </section>

      <p id="error" class="error" hidden></p>

      <div class="content">
        <table id="items">
          <thead>
            <tr>
              <th>Name</th>
              <th>Quantity</th>
              <th>Stock alarm</th>
              <th>Notes</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="items-body"></tbody>
        </table>
        <p id="empty" hidden>No items yet — click “Add Item” to create your first one.</p>
      </div>
    </main>
  </body>
</html>
